name: Verify macOS input-source registration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-macos-pkg-install.yml"
      - "macos/**"
      - "packaging/macos/**"
      - "scripts/package-macos.sh"
  pull_request:
    paths:
      - ".github/workflows/verify-macos-pkg-install.yml"
      - "macos/**"
      - "packaging/macos/**"
      - "scripts/package-macos.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-macos-pkg-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build deployment-target app
    runs-on: macos-26

    steps:
      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-native-${{ hashFiles('vcpkg-configuration.json', 'engine/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Install build prerequisites
        run: brew install pkg-config

      - name: Build the app
        run: macos/scripts/build-native-app.sh

      - name: Archive the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/macos/LlavonIME.app "${RUNNER_TEMP}/LlavonIME.app.zip"

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: macos-input-method-app
          path: ${{ runner.temp }}/LlavonIME.app.zip
          retention-days: 1

  install:
    name: Install and upgrade on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the app
        uses: actions/download-artifact@v4
        with:
          name: macos-input-method-app
          path: ${{ runner.temp }}

      - name: Extract the app
        run: |
          mkdir -p dist/macos
          ditto -x -k "${RUNNER_TEMP}/LlavonIME.app.zip" dist/macos

      - name: Build the test package
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/pkgroot"
          payload="${root}/Library/Application Support/llavon-ime"
          rm -rf "${root}"
          mkdir -p "${root}/Library/Input Methods" \
                   "${payload}/tools" \
                   "${payload}/share/llavon-ime/tables"
          ditto "dist/macos/LlavonIME.app" "${root}/Library/Input Methods/LlavonIME.app"
          clang -O2 -Wall -Wextra -framework Carbon \
            -o "${payload}/tools/llavon-ime-tis" packaging/macos/tools/tis.c
          cp ime-core/table/bopomofo_char.json "${payload}/share/llavon-ime/tables/"
          component="${RUNNER_TEMP}/llavon-ime-component.pkg"
          distribution="${RUNNER_TEMP}/Distribution.xml"
          pkgbuild \
            --root "${root}" \
            --scripts packaging/macos/scripts \
            --component-plist packaging/macos/LlavonIME-component.plist \
            --identifier llavon-ime-install-check \
            --version 0.0.0 \
            --install-location / \
            "${component}"
          sed 's/@PACKAGE_IDENTIFIER@/llavon-ime-install-check/g' \
            packaging/macos/Distribution.xml.in > "${distribution}"
          productbuild \
            --distribution "${distribution}" \
            --resources packaging/macos/resources \
            --package-path "${RUNNER_TEMP}" \
            "${RUNNER_TEMP}/llavon-ime-install-check.pkg"

      - name: Verify installer guidance
        run: |
          set -euo pipefail
          expanded="${RUNNER_TEMP}/expanded-package"
          pkgutil --expand "${RUNNER_TEMP}/llavon-ime-install-check.pkg" "${expanded}"
          grep -q '<conclusion file="Conclusion.html"' "${expanded}/Distribution"
          grep -q '登出並重新登入，或重新啟動 Mac' "${expanded}/Resources/Conclusion.html"

      - name: Check the runner session
        run: |
          set -euo pipefail
          console_user="$(stat -f %Su /dev/console)"
          echo "console user: ${console_user}"
          test "${console_user}" != "root"
          test "${console_user}" != "loginwindow"
          pgrep -x TextInputMenuAgent

      - name: Install the package
        run: sudo installer -pkg "${RUNNER_TEMP}/llavon-ime-install-check.pkg" -target /

      - name: Verify the install registered the source and launched the input method
        run: |
          set -euo pipefail
          console_user="$(stat -f %Su /dev/console)"
          app="/Library/Input Methods/LlavonIME.app"
          tis="/Library/Application Support/llavon-ime/tools/llavon-ime-tis"
          bundle_id="com.llavon.inputmethod.LlavonIME"

          test -x "${app}/Contents/MacOS/LlavonIME"

          # The postinstall launches the installed executable so it is usable
          # without a log out; registration remains installer-owned.
          for _ in 1 2 3 4 5; do
            pgrep -x LlavonIME >/dev/null 2>&1 && break
            sleep 1
          done
          pid="$(pgrep -x LlavonIME | head -1)"
          test -n "${pid}"
          test "$(ps -o user= -p "${pid}" | tr -d ' ')" = "${console_user}"

          # The text input system knows the bundle. `status` exits non-zero
          # when no input source matches; its "not registered" message
          # contains the bundle id, so a grep would not catch that.
          if ! "${tis}" status "${bundle_id}"; then
            echo "the input source is not registered with the text input system" >&2
            exit 1
          fi

          # TISEnableInputSource is a no-op for third-party input methods, and
          # macOS 26 keeps the enabled third-party sources in a protected store
          # that only System Settings writes, so there is no programmatic
          # enable to verify there. On macOS 15 and earlier the postinstall
          # writes the HIToolbox enabled list, which is what this checks.
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -lt 26 ]; then
            defaults read com.apple.HIToolbox AppleEnabledInputSources \
              | grep -q "${bundle_id}"
          fi

          "${tis}" list "${bundle_id}" | sort > "${RUNNER_TEMP}/input-sources-before-upgrade"

      - name: Verify an upgrade keeps working without a log out
        run: |
          set -euo pipefail
          before="$(pgrep -x LlavonIME | head -1)"

          sudo installer -pkg "${RUNNER_TEMP}/llavon-ime-install-check.pkg" -target /

          after=""
          for _ in 1 2 3 4 5; do
            after="$(pgrep -x LlavonIME | head -1 || true)"
            if [ -n "${after}" ] && [ "${after}" != "${before}" ]; then
              break
            fi
            sleep 1
          done
          test -n "${after}"
          test "${after}" != "${before}"

          # The replaced bundle is still registered with the text input system,
          # without registering another copy during the upgrade or app launch.
          tis="/Library/Application Support/llavon-ime/tools/llavon-ime-tis"
          registered=0
          # TIS can take a moment to refresh the existing registration after
          # the bundle is replaced; polling must not register it again.
          for _ in {1..15}; do
            if "${tis}" status com.llavon.inputmethod.LlavonIME; then
              registered=1
              break
            fi
            sleep 1
          done
          if [ "${registered}" -ne 1 ]; then
            echo "the input source is not registered with the text input system" >&2
            exit 1
          fi

          "${tis}" list com.llavon.inputmethod.LlavonIME | sort > "${RUNNER_TEMP}/input-sources-after-upgrade"
          if ! cmp -s "${RUNNER_TEMP}/input-sources-before-upgrade" "${RUNNER_TEMP}/input-sources-after-upgrade"; then
            echo "the upgrade changed the registered input-source list" >&2
            diff -u "${RUNNER_TEMP}/input-sources-before-upgrade" "${RUNNER_TEMP}/input-sources-after-upgrade" || true
            exit 1
          fi

          # On macOS 15 and earlier the enabled input source survives the
          # upgrade in the HIToolbox list; macOS 26 keeps it in a protected
          # store that only System Settings writes, so there is nothing to
          # check there.
          if [ "$(sw_vers -productVersion | cut -d. -f1)" -lt 26 ]; then
            defaults read com.apple.HIToolbox AppleEnabledInputSources \
              | grep -q com.llavon.inputmethod.LlavonIME
          fi

      - name: Show diagnostics on failure
        if: failure()
        run: |
          set -x
          tis="/Library/Application Support/llavon-ime/tools/llavon-ime-tis"
          ls -la "/Library/Input Methods" "/Library/Application Support/llavon-ime" || true
          ls -la "/Library/Application Support/llavon-ime/tools" || true
          pgrep -l -x LlavonIME || true
          pgrep -l -x TextInputMenuAgent || true
          "${tis}" status com.llavon.inputmethod.LlavonIME || true
          "${tis}" list com.llavon.inputmethod.LlavonIME || true
          defaults read com.apple.HIToolbox AppleEnabledInputSources || true
          defaults read com.apple.HIToolbox AppleSelectedInputSources || true
          defaults read com.apple.inputsources || true
          echo "--- tis process log"
          log show --last 15m --predicate 'process == "llavon-ime-tis"' --style compact | tail -150 || true
          tail -100 /var/log/install.log || true
          log show --last 15m --predicate 'process == "LlavonIME"' --style compact | tail -100 || true
          log show --last 15m --predicate 'eventMessage CONTAINS[c] "llavon"' --style compact || true

      - name: Uninstall
        if: always()
        run: |
          sudo pkill -x LlavonIME || true
          sudo rm -rf "/Library/Input Methods/LlavonIME.app" \
                      "/Library/Application Support/llavon-ime"
          sudo pkgutil --forget llavon-ime-install-check || true
