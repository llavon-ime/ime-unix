name: Release Linux packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release version without v prefix, for example 0.9.0"
        required: true
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  MODEL_REPOSITORY: "tony65535/llavon-ime-llama-250m-GGUF"
  MODEL_REVISION: "fae44704fb1a7361bcc1150bf910c1d74fa367a4"
  MODEL_FILE_NAME: "llavon-ime-llama-250m-Q4_K_M.gguf"
  MODEL_SHA256: "e0205904a65b735ed735b709d5e1502ebbe31fbd1393042573af9843d39e2ab8"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build-linux:
    name: Build ${{ matrix.format }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: debian:13
          - format: rpm
            image: fedora:43
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install Debian build dependencies
        if: matrix.format == 'deb'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake libtool \
            binutils build-essential ca-certificates cmake curl dbus-daemon dpkg-dev fcitx5-modules \
            fcitx5-modules-dev file g++ gcc git \
            libatspi2.0-dev libfcitx5core-dev libglib2.0-dev libsqlite3-dev libvulkan1 ninja-build patchelf \
            pkg-config python3 tar unzip zip qt6-base-dev qt6-qpa-plugins qt6-wayland

      - name: Install Fedora build dependencies
        if: matrix.format == 'rpm'
        run: |
          set -euo pipefail
          dnf install -y \
            autoconf autoconf-archive automake libtool \
            at-spi2-core-devel binutils ca-certificates cmake curl dbus-daemon dbus-tools fcitx5 fcitx5-data \
            fcitx5-devel file gcc-c++ git glib2-devel ninja-build patchelf pkgconf-pkg-config sqlite-devel \
            python3 rpm-build tar unzip vulkan-loader zip qt6-qtbase-devel qt6-qtwayland

      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust container checkout
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/vcpkg"

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify release source
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git checkout --detach "${RELEASE_TAG}^{commit}"
          fi
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]] || \
             ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag ${RELEASE_TAG} does not point to a commit on main; refusing to publish." >&2
            exit 1
          fi

      # v0.9.0 uses SQLite3::SQLite3, introduced after the distros' CMake.
      # Keep tagged builds reproducible without changing the released source.
      # The official tarball is verified against its published SHA-256 and
      # unpacked under /tmp, so the build needs no package manager or Python.
      - name: Install pinned package-build CMake
        env:
          CMAKE_TOOL_SHA256: "d6c83076c575bc00b823522ac974bda66d0af05d6ddc30e739c12385cf32c6cc"
        run: |
          set -euo pipefail
          archive=/tmp/cmake-4.4.3-linux-x86_64.tar.gz
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/Kitware/CMake/releases/download/v4.4.3/cmake-4.4.3-linux-x86_64.tar.gz"
          echo "${CMAKE_TOOL_SHA256}  ${archive}" | sha256sum --check -
          mkdir -p /tmp/cmake-4.4.3
          tar -xzf "${archive}" -C /tmp/cmake-4.4.3 --strip-components=1
          echo /tmp/cmake-4.4.3/bin >> "${GITHUB_PATH}"

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: /root/.cache/vcpkg/archives
          key: linux-${{ matrix.format }}-vcpkg-${{ hashFiles('vcpkg-configuration.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-core/vcpkg.json', 'ime-unix-service/triplets/x64-linux-llavon-prebuilt.cmake') }}
          restore-keys: |
            linux-${{ matrix.format }}-vcpkg-

      - name: Download bundled model
        run: |
          set -euo pipefail
          mkdir -p models
          curl --fail --location --retry 3 \
            --output "models/${MODEL_FILE_NAME}" \
            "https://huggingface.co/${MODEL_REPOSITORY}/resolve/${MODEL_REVISION}/${MODEL_FILE_NAME}"
          test -s "models/${MODEL_FILE_NAME}"
          echo "${MODEL_SHA256}  models/${MODEL_FILE_NAME}" | sha256sum --check -

      - name: Build native package
        env:
          CC: gcc
          CXX: g++
          LLAVON_IME_VERSION: ${{ steps.version.outputs.version }}
          LLAVON_IME_PACKAGE_MODEL_PATH: models/${{ env.MODEL_FILE_NAME }}
          VCPKG_BINARY_SOURCES: clear;files,/root/.cache/vcpkg/archives,readwrite
        run: dbus-run-session -- bash scripts/package-linux.sh "${{ matrix.format }}"

      - name: Inspect package dependencies
        run: |
          set -euo pipefail
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            package="$(find dist/linux -name '*.deb' -print -quit)"
            dpkg-deb --info "${package}"
            dpkg-deb --contents "${package}"
            dependencies="$(dpkg-deb --field "${package}" Depends)"
            grep -q 'fcitx5' <<< "${dependencies}"
            grep -q 'at-spi2-core' <<< "${dependencies}"
            grep -q 'libatspi2.0' <<< "${dependencies}"
            grep -q 'libglib2.0' <<< "${dependencies}"
            grep -q 'libvulkan1' <<< "${dependencies}"
            grep -q 'curl' <<< "${dependencies}"
            grep -q 'tar' <<< "${dependencies}"
            grep -q 'coreutils' <<< "${dependencies}"
          else
            package="$(find dist/linux -name '*.rpm' -print -quit)"
            rpm -qip "${package}"
            rpm -qlp "${package}"
            dependencies="$(rpm -qpR "${package}")"
            grep -q '^fcitx5' <<< "${dependencies}"
            grep -q '^at-spi2-core' <<< "${dependencies}"
            grep -q '^glib2' <<< "${dependencies}"
            grep -q '^vulkan-loader' <<< "${dependencies}"
            grep -q '^curl' <<< "${dependencies}"
            grep -q '^tar' <<< "${dependencies}"
            grep -q '^coreutils' <<< "${dependencies}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            build/package-linux-${{ matrix.format }}/addon/engine/tests/llavon_ime_tests
          if-no-files-found: error
          retention-days: 14

  verify-clean-install:
    name: Verify clean ${{ matrix.format }} install
    needs: build-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: debian:13
            private-libdir: /usr/lib/llavon-ime
          - format: rpm
            image: fedora:43
            private-libdir: /usr/lib64/llavon-ime
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.format }}
          path: .

      - name: Install package and declared dependencies
        run: |
          set -euo pipefail
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            apt-get update
            apt-get install -y --no-install-recommends ./dist/linux/*.deb
            dpkg-query -W llavon-ime-fcitx5 fcitx5 at-spi2-core libatspi2.0-0t64 libvulkan1
          else
            dnf install -y --setopt=install_weak_deps=False ./dist/linux/*.rpm
            rpm -q llavon-ime-fcitx5 fcitx5 at-spi2-core glib2 vulkan-loader
          fi

      - name: Verify complete installed runtime
        env:
          PRIVATE_LIBDIR: ${{ matrix.private-libdir }}
        run: |
          set -euo pipefail
          "${PRIVATE_LIBDIR}/llavon-ime-unix-service" --help
          test -x "${PRIVATE_LIBDIR}/atspi_probe"
          test -s /usr/share/llavon-ime/models/${MODEL_FILE_NAME}
          test -f "${PRIVATE_LIBDIR}/libggml-cpu-x64.so"
          test -f "${PRIVATE_LIBDIR}/libggml-cpu-skylakex.so"
          test -f "${PRIVATE_LIBDIR}/libggml-vulkan.so"
          addon="$(find /usr -path '*/fcitx5/llavon-ime-addon.so' -print -quit)"
          test -n "${addon}"
          ! ldd "${addon}" | grep -q 'not found'
          while IFS= read -r -d '' binary; do
            ! LD_LIBRARY_PATH="${PRIVATE_LIBDIR}" ldd "${binary}" | grep -q 'not found'
          done < <(find "${PRIVATE_LIBDIR}" -type f -print0)
          grep -a -q 'libatspi.so.0' "${addon}"
          loader_cache="$(ldconfig -p)"
          grep -q 'libatspi.so.0' <<< "${loader_cache}"
          grep -q 'libvulkan.so.1' <<< "${loader_cache}"
          if [[ "${{ matrix.format }}" == "deb" ]]; then
            atspi_files="$(dpkg -L at-spi2-core)"
          else
            atspi_files="$(rpm -ql at-spi2-core)"
          fi
          grep -q 'at-spi-bus-launcher' <<< "${atspi_files}"

      - name: Run installed service end to end
        env:
          PRIVATE_LIBDIR: ${{ matrix.private-libdir }}
        run: |
          set -euo pipefail
          test_client="$(find . -name llavon_ime_tests -print -quit)"
          test -n "${test_client}"
          chmod +x "${test_client}"
          runtime_dir="$(mktemp -d)"
          "${PRIVATE_LIBDIR}/llavon-ime-unix-service" \
            --socket "${runtime_dir}/ime.sock" \
            --model "/usr/share/llavon-ime/models/${MODEL_FILE_NAME}" \
            --tables /usr/share/llavon-ime/tables \
            > "${runtime_dir}/service.log" 2>&1 &
          service_pid=$!
          trap 'kill "${service_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 120); do
            [[ -S "${runtime_dir}/ime.sock" ]] && break
            sleep 1
          done
          if [[ ! -S "${runtime_dir}/ime.sock" ]]; then
            cat "${runtime_dir}/service.log" >&2
            exit 1
          fi
          LLAVON_IME_REAL_SERVICE=1 \
          LLAVON_IME_REAL_SERVICE_ONLY=1 \
          LLAVON_IME_UNIX_SOCKET_PATH="${runtime_dir}/ime.sock" \
            "${test_client}" || {
              cat "${runtime_dir}/service.log" >&2
              exit 1
            }

  publish-linux:
    name: Attach Linux packages to release
    needs: verify-clean-install
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: .
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          # A moved tag leaves its release behind as a draft that the by-tag
          # lookups cannot see, and `gh release create` refuses to replace it.
          # Drop those leftovers so the tag gets a release that is reachable
          # through its download URLs.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\" and .draft == true) | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" --verify-tag --title "${tag}" \
              --notes "Llavon IME packages for macOS, Debian/Ubuntu, and Fedora." || \
              gh release view "${tag}" >/dev/null
          fi
          gh release upload "${tag}" dist/linux/*.deb dist/linux/*.rpm --clobber
          # Publishing and re-stating the tag keeps the release attached to the
          # tag that exists now: a release left over from a replaced tag serves
          # 404 for every asset URL even though its upload succeeded.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -1)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f draft=false -f tag_name="${tag}" >/dev/null
          asset_url="$(gh release view "${tag}" --json assets --jq '.assets[0].url')"
          curl --fail --silent --show-error --location --head "${asset_url}" >/dev/null
          gh release view "${tag}" --json isDraft --jq '.isDraft' | grep -qx false
