name: Release macOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

# The rolling feed must be updated in release order.
concurrency:
  group: macos-release-feed
  cancel-in-progress: false

env:
  MODEL_REPOSITORY: "tony65535/llavon-ime-llama-250m-GGUF"
  MODEL_REVISION: "fae44704fb1a7361bcc1150bf910c1d74fa367a4"
  MODEL_FILE_NAME: "llavon-ime-llama-250m-Q4_K_M.gguf"
  MODEL_SHA256: "e0205904a65b735ed735b709d5e1502ebbe31fbd1393042573af9843d39e2ab8"
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  release-macos:
    name: Build pkg and publish Sparkle updates
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      LLAVON_IME_ENABLE_UPDATES: "1"
      LLAVON_IME_RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check runner architecture
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "${arch}" != "arm64" ]]; then
            echo "This workflow publishes the arm64 package, but the runner architecture is ${arch}." >&2
            exit 1
          fi

      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${VERSION_INPUT}"
            version="${version#v}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git checkout --detach "${RELEASE_TAG}^{commit}"
          fi
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]] || \
             ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag ${RELEASE_TAG} does not point to a commit on main; refusing to publish." >&2
            exit 1
          fi

      - name: Require Sparkle keys and select Apple signing mode
        id: signing
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Set ${name} before publishing an app-managed update." >&2
              exit 1
            fi
          done
          signing_names=(MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD)
          configured=0
          for name in "${signing_names[@]}"; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "${configured}" == 0 ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "Publishing an ad-hoc signed, unnotarized package with Sparkle-verified updates."
            exit 0
          fi
          for name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY \
            MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Set ${name} before publishing an app-managed update." >&2
              exit 1
            fi
          done
          echo "signed=true" >> "${GITHUB_OUTPUT}"
          echo "LLAVON_IME_ENABLE_UPDATES=1" >> "${GITHUB_ENV}"

      - name: Verify update tooling
        run: bash macos/scripts/verify-updates.sh

      - name: Install build tools
        run: |
          set -euo pipefail
          brew update
          brew install autoconf autoconf-archive automake libtool cmake ninja pkg-config qtbase

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg-configuration.json', 'engine/vcpkg.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-core/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Import signing certificates
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 -D > "${cert_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${cert_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"

      - name: Download bundled model
        run: |
          set -euo pipefail
          mkdir -p models
          model_path="models/${MODEL_FILE_NAME}"
          curl --fail --location --retry 3 \
            --output "${model_path}" \
            "https://huggingface.co/${MODEL_REPOSITORY}/resolve/${MODEL_REVISION}/${MODEL_FILE_NAME}"
          test -s "${model_path}"
          echo "${MODEL_SHA256}  ${model_path}" | shasum -a 256 --check -
          case "${model_path}" in
            *.gguf) ;;
            *)
              echo "Downloaded model must use the .gguf extension: ${model_path}" >&2
              exit 1
              ;;
          esac

      - name: Build package
        id: package
        run: |
          set -euo pipefail
          LLAVON_IME_VERSION="${{ steps.version.outputs.version }}" \
          ./scripts/package-macos.sh

          unsigned_pkg="dist/macos/llavon-ime-${{ steps.version.outputs.version }}-arm64.pkg"
          signed_pkg="dist/macos/llavon-ime-${{ steps.version.outputs.version }}-arm64-signed.pkg"
          if [[ -f "${signed_pkg}" ]]; then
            mv "${signed_pkg}" "${unsigned_pkg}"
          fi
          echo "pkg=${unsigned_pkg}" >> "${GITHUB_OUTPUT}"

      - name: Notarize package
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          xcrun notarytool submit "${pkg}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "${pkg}"

      - name: Compute sha256
        id: sha
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          sha="$(shasum -a 256 "${pkg}" | awk '{print $1}')"
          echo "sha256=${sha}" >> "${GITHUB_OUTPUT}"
          echo "${sha}  ${pkg}"

      - name: Sign package and generate signed appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PKG: ${{ steps.package.outputs.pkg }}
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE}"
          source macos/scripts/sparkle-config.sh
          prepare_sparkle
          key_file="${RUNNER_TEMP}/sparkle-private-key"
          trap 'rm -f "${key_file}"' EXIT
          umask 077
          printf '%s' "${SPARKLE_PRIVATE_ED_KEY}" > "${key_file}"
          signature="$("${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" -p "${RELEASE_PKG}")"
          swift macos/scripts/verify-update-signature.swift "${SPARKLE_PUBLIC_ED_KEY}" "${signature}" "${RELEASE_PKG}"
          if [[ "${{ steps.signing.outputs.signed }}" == true ]]; then
            pkgutil --check-signature "${RELEASE_PKG}"
            xcrun stapler validate "${RELEASE_PKG}"
          fi

          # Use the macOS-only feed, never GitHub's /releases/latest, which may
          # have been published by Linux while its macOS pkg is still building.
          previous_args=()
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "macos-updates") | .assets[] | select(.name == "appcast.xml") | .browser_download_url' \
            > "${RUNNER_TEMP}/previous-feed-url"
          previous_url="$(cat "${RUNNER_TEMP}/previous-feed-url")"
          if [[ -n "${previous_url}" ]]; then
            curl --fail --location --retry 3 "${previous_url}" -o "${RUNNER_TEMP}/previous-appcast.xml"
            "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" --verify "${RUNNER_TEMP}/previous-appcast.xml"
            previous_args=(--previous "${RUNNER_TEMP}/previous-appcast.xml")
          fi
          python3 scripts/macos-appcast.py --version "${RELEASE_VERSION}" \
            --package "${RELEASE_PKG}" --signature "${signature}" \
            --repository "${GITHUB_REPOSITORY}" ${previous_args[@]+"${previous_args[@]}"} \
            --output dist/macos/appcast.xml
          "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" dist/macos/appcast.xml
          "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" --verify dist/macos/appcast.xml

      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          assets=(
            "${{ steps.package.outputs.pkg }}"
            "dist/macos/appcast.xml"
          )
          notes="拉風輸入法 macOS 安裝套件。"
          if [[ "${{ steps.signing.outputs.signed }}" != true ]]; then
            notes="拉風輸入法 macOS 安裝套件（Apple Silicon）。"
            install_notes="${RUNNER_TEMP}/macos-install-notes.md"
            cat > "${install_notes}" <<'NOTES'
          ### macOS 安裝與自動更新（Apple Silicon）

          下載本頁的 `.pkg` 安裝包，開啟後依提示完成安裝。

          此安裝包未使用 Apple Developer ID 簽章，也未經 Apple 公證；程式使用 ad-hoc 簽章。

          若 macOS 阻擋安裝：

          1. 前往「系統設定 → 隱私權與安全性」。
          2. 找到被阻擋的安裝程式，按「仍要打開」，依提示完成安裝。
          3. 安裝完成後，前往「系統設定 → 鍵盤 → 文字輸入 → 編輯」，加入「拉風輸入法」。

          macOS 也可能要求你在「隱私權與安全性」中允許已安裝的輸入法執行。

          #### 自動更新

          輸入法使用 Sparkle 檢查及下載更新，並驗證更新來源與安裝包的簽章。安裝更新時需要管理員授權。

          #### 從 Homebrew 安裝遷移

          Homebrew Cask 不再更新。曾透過 Homebrew 安裝的使用者，先備份個人設定與訓練資料，再直接使用本頁的 `.pkg` 覆蓋安裝，之後改由輸入法內的 Sparkle 管理更新。不需先解除安裝；Homebrew 的安裝紀錄會保留，請勿再對這個 Cask 執行升級、解除安裝或 `--zap`，以免覆蓋或刪除輸入法與資料。
          NOTES
          fi
          # A moved tag leaves its release behind as a draft that the by-tag
          # lookups cannot see, and `gh release create` refuses to replace it.
          # Drop those leftovers so the tag gets a release that is reachable
          # through its download URLs.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\" and .draft == true) | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --title "${tag}" \
              --notes "${notes}" || \
              gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --notes "${notes}" || \
              gh release upload "${tag}" "${assets[@]}" --clobber
          fi
          # Publishing and re-stating the tag keeps the release attached to the
          # tag that exists now: a release left over from a replaced tag serves
          # 404 for every asset URL even though its upload succeeded.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -1)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f draft=false -f tag_name="${tag}" >/dev/null
          asset_url="$(gh release view "${tag}" --json assets --jq '.assets[0].url')"
          curl --fail --silent --show-error --location --head "${asset_url}" >/dev/null
          gh release view "${tag}" --json isDraft --jq '.isDraft' | grep -qx false
          if [[ "${{ steps.signing.outputs.signed }}" != true ]]; then
            gh release view "${tag}" --json body --jq '.body // ""' > "${RUNNER_TEMP}/release-notes.md"
            python3 - "${RUNNER_TEMP}/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'(?ms)^### macOS (?:manual installation|installation and updates|安裝與自動更新)[^\n]*\n.*?(?=^###? |\Z)', '', text)
          path.write_text(text.rstrip() + '\n')
          PY
            printf '\n' >> "${RUNNER_TEMP}/release-notes.md"
            cat "${install_notes}" >> "${RUNNER_TEMP}/release-notes.md"
            gh release edit "${tag}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Publish macOS update feed after the package is reachable
        run: |
          set -euo pipefail
          pkg_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/llavon-ime-${{ steps.version.outputs.version }}-arm64.pkg"
          curl --fail --silent --show-error --location --head "${pkg_url}" >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "macos-updates") | .id' > "${RUNNER_TEMP}/feed-release-id"
          if [[ ! -s "${RUNNER_TEMP}/feed-release-id" ]]; then
            gh release create macos-updates --target "${GITHUB_SHA}" --prerelease \
              --title "macOS update feed" --notes "Signed Sparkle feed for app-managed macOS pkg updates."
          fi
          gh release upload macos-updates dist/macos/appcast.xml --clobber
          feed_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/macos-updates/appcast.xml"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache' "${feed_url}?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              -o "${RUNNER_TEMP}/published-appcast.xml" && \
              cmp -s dist/macos/appcast.xml "${RUNNER_TEMP}/published-appcast.xml"; then
              echo "Published appcast matches the signed feed."
              exit 0
            fi
            echo "Published feed is not yet consistent (attempt ${attempt}/12)." >&2
            if [[ "${attempt}" != 12 ]]; then sleep 10; fi
          done
          echo "Published appcast still differs from the signed feed; refusing to report success." >&2
          exit 1
