name: Release macOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

# The rolling feed and Homebrew cask must be updated in release order.
concurrency:
  group: macos-release-feed
  cancel-in-progress: false

env:
  MODEL_REPOSITORY: "tony65535/llavon-ime-llama-250m-GGUF"
  MODEL_REVISION: "fae44704fb1a7361bcc1150bf910c1d74fa367a4"
  MODEL_FILE_NAME: "llavon-ime-llama-250m-Q4_K_M.gguf"
  MODEL_SHA256: "e0205904a65b735ed735b709d5e1502ebbe31fbd1393042573af9843d39e2ab8"
  HOMEBREW_TAP_REPO: "llavon-ime/homebrew-llavon-ime"
  HOMEBREW_CASK_PATH: "Casks/llavon-ime.rb"
  RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  release-macos:
    name: Build pkg and update Homebrew tap
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      LLAVON_IME_ENABLE_UPDATES: "1"
      LLAVON_IME_RELEASE_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Check runner architecture
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [[ "${arch}" != "arm64" ]]; then
            echo "This workflow currently publishes the arm64 Cask asset, but the runner architecture is ${arch}." >&2
            exit 1
          fi

      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${VERSION_INPUT}"
            version="${version#v}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
        env:
          VERSION_INPUT: ${{ inputs.version }}

      - name: Verify release source
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git checkout --detach "${RELEASE_TAG}^{commit}"
          fi
          if [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$(git rev-parse HEAD)" ]] || \
             ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag ${RELEASE_TAG} does not point to a commit on main; refusing to publish." >&2
            exit 1
          fi

      - name: Require Sparkle keys and select Apple signing mode
        id: signing
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          for name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Set ${name} before publishing an app-managed update." >&2
              exit 1
            fi
          done
          signing_names=(MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD)
          configured=0
          for name in "${signing_names[@]}"; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "${configured}" == 0 ]]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "Publishing an ad-hoc signed, unnotarized package with Sparkle-verified updates."
            exit 0
          fi
          for name in SPARKLE_PUBLIC_ED_KEY SPARKLE_PRIVATE_ED_KEY \
            MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
            DEVELOPER_ID_APPLICATION DEVELOPER_ID_INSTALLER \
            APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Set ${name} before publishing an app-managed update." >&2
              exit 1
            fi
          done
          echo "signed=true" >> "${GITHUB_OUTPUT}"
          echo "LLAVON_IME_ENABLE_UPDATES=1" >> "${GITHUB_ENV}"

      - name: Verify update tooling
        run: bash macos/scripts/verify-updates.sh

      - name: Install build tools
        run: |
          set -euo pipefail
          brew update
          brew install autoconf autoconf-archive automake libtool cmake ninja pkg-config qtbase

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg-configuration.json', 'engine/vcpkg.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-core/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Import signing certificates
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/build.keychain-db"
          printf '%s' "${MACOS_CERTIFICATE_P12}" | base64 -D > "${cert_path}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${cert_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain-db
          security default-keychain -s "${keychain_path}"
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${keychain_path}"

      - name: Download bundled model
        run: |
          set -euo pipefail
          mkdir -p models
          model_path="models/${MODEL_FILE_NAME}"
          curl --fail --location --retry 3 \
            --output "${model_path}" \
            "https://huggingface.co/${MODEL_REPOSITORY}/resolve/${MODEL_REVISION}/${MODEL_FILE_NAME}"
          test -s "${model_path}"
          echo "${MODEL_SHA256}  ${model_path}" | shasum -a 256 --check -
          case "${model_path}" in
            *.gguf) ;;
            *)
              echo "Downloaded model must use the .gguf extension: ${model_path}" >&2
              exit 1
              ;;
          esac

      - name: Build package
        id: package
        run: |
          set -euo pipefail
          LLAVON_IME_VERSION="${{ steps.version.outputs.version }}" \
          ./scripts/package-macos.sh

          unsigned_pkg="dist/macos/llavon-ime-${{ steps.version.outputs.version }}-arm64.pkg"
          signed_pkg="dist/macos/llavon-ime-${{ steps.version.outputs.version }}-arm64-signed.pkg"
          if [[ -f "${signed_pkg}" ]]; then
            mv "${signed_pkg}" "${unsigned_pkg}"
          fi
          echo "pkg=${unsigned_pkg}" >> "${GITHUB_OUTPUT}"

      - name: Notarize package
        if: env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          xcrun notarytool submit "${pkg}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --wait
          xcrun stapler staple "${pkg}"

      - name: Compute sha256
        id: sha
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          sha="$(shasum -a 256 "${pkg}" | awk '{print $1}')"
          echo "sha256=${sha}" >> "${GITHUB_OUTPUT}"
          echo "${sha}  ${pkg}"

      - name: Sign package and generate signed appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PKG: ${{ steps.package.outputs.pkg }}
        run: |
          set -euo pipefail
          ROOT_DIR="${GITHUB_WORKSPACE}"
          source macos/scripts/sparkle-config.sh
          prepare_sparkle
          key_file="${RUNNER_TEMP}/sparkle-private-key"
          trap 'rm -f "${key_file}"' EXIT
          umask 077
          printf '%s' "${SPARKLE_PRIVATE_ED_KEY}" > "${key_file}"
          signature="$("${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" -p "${RELEASE_PKG}")"
          swift macos/scripts/verify-update-signature.swift "${SPARKLE_PUBLIC_ED_KEY}" "${signature}" "${RELEASE_PKG}"
          if [[ "${{ steps.signing.outputs.signed }}" == true ]]; then
            pkgutil --check-signature "${RELEASE_PKG}"
            xcrun stapler validate "${RELEASE_PKG}"
          fi

          # Use the macOS-only feed, never GitHub's /releases/latest, which may
          # have been published by Linux while its macOS pkg is still building.
          previous_args=()
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "macos-updates") | .assets[] | select(.name == "appcast.xml") | .browser_download_url' \
            > "${RUNNER_TEMP}/previous-feed-url"
          previous_url="$(cat "${RUNNER_TEMP}/previous-feed-url")"
          if [[ -n "${previous_url}" ]]; then
            curl --fail --location --retry 3 "${previous_url}" -o "${RUNNER_TEMP}/previous-appcast.xml"
            "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" --verify "${RUNNER_TEMP}/previous-appcast.xml"
            previous_args=(--previous "${RUNNER_TEMP}/previous-appcast.xml")
          fi
          python3 scripts/macos-appcast.py --version "${RELEASE_VERSION}" \
            --package "${RELEASE_PKG}" --signature "${signature}" \
            --repository "${GITHUB_REPOSITORY}" ${previous_args[@]+"${previous_args[@]}"} \
            --output dist/macos/appcast.xml
          "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" dist/macos/appcast.xml
          "${SPARKLE_DIR}/bin/sign_update" --ed-key-file "${key_file}" --verify dist/macos/appcast.xml

      - name: Create or update GitHub release
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          assets=(
            "${{ steps.package.outputs.pkg }}"
            "dist/macos/appcast.xml"
          )
          notes="Native macOS input method package."
          if [[ "${{ steps.signing.outputs.signed }}" != true ]]; then
            notes="Native macOS input method package (Apple Silicon). This package is not Developer ID signed or notarized; its executables use ad-hoc signatures. Sparkle verifies update signatures; package installation requires administrator approval."
            install_notes="${RUNNER_TEMP}/macos-install.txt"
            cat > "${install_notes}" <<'NOTES'
          ### macOS installation and updates (Apple Silicon)

          The macOS `.pkg` is **not Developer ID signed or Apple notarized**. Executables use ad-hoc signatures. In-app updates use Sparkle to verify update signatures, download packages, and request administrator approval for installation. Apple notarization and Sparkle update signature verification are separate mechanisms.

          Download the `.pkg` from this release and open it in Finder. If macOS blocks the installer, open **System Settings → Privacy & Security**, find the blocked installer, and choose **Open Anyway**, then follow the installer prompts. After installation, add 拉風輸入法 in **System Settings → Keyboard → Text Input → Edit**. macOS may also require approval of the installed input method in Privacy & Security.
          NOTES
            assets+=("${install_notes}#macos-install.txt")
          fi
          # A moved tag leaves its release behind as a draft that the by-tag
          # lookups cannot see, and `gh release create` refuses to replace it.
          # Drop those leftovers so the tag gets a release that is reachable
          # through its download URLs.
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\" and .draft == true) | .id" |
            while read -r id; do gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"; done
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            gh release create "${tag}" "${assets[@]}" \
              --verify-tag \
              --title "${tag}" \
              --notes "${notes}" || \
              gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --notes "${notes}" || \
              gh release upload "${tag}" "${assets[@]}" --clobber
          fi
          # Publishing and re-stating the tag keeps the release attached to the
          # tag that exists now: a release left over from a replaced tag serves
          # 404 for every asset URL even though its upload succeeded.
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -1)"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f draft=false -f tag_name="${tag}" >/dev/null
          asset_url="$(gh release view "${tag}" --json assets --jq '.assets[0].url')"
          curl --fail --silent --show-error --location --head "${asset_url}" >/dev/null
          gh release view "${tag}" --json isDraft --jq '.isDraft' | grep -qx false
          if [[ "${{ steps.signing.outputs.signed }}" != true ]]; then
            gh release view "${tag}" --json body --jq '.body // ""' > "${RUNNER_TEMP}/release-notes.md"
            python3 - "${RUNNER_TEMP}/release-notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'(?ms)^### macOS (?:manual installation|installation and updates)[^\n]*\n.*?(?=^###? |\Z)', '', text)
          path.write_text(text.rstrip() + '\n')
          PY
            printf '\n' >> "${RUNNER_TEMP}/release-notes.md"
            cat "${install_notes}" >> "${RUNNER_TEMP}/release-notes.md"
            gh release edit "${tag}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Publish macOS update feed after the package is reachable
        run: |
          set -euo pipefail
          pkg_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/llavon-ime-${{ steps.version.outputs.version }}-arm64.pkg"
          curl --fail --silent --show-error --location --head "${pkg_url}" >/dev/null
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "macos-updates") | .id' > "${RUNNER_TEMP}/feed-release-id"
          if [[ ! -s "${RUNNER_TEMP}/feed-release-id" ]]; then
            gh release create macos-updates --target "${GITHUB_SHA}" --prerelease \
              --title "macOS update feed" --notes "Signed Sparkle feed for app-managed macOS pkg updates."
          fi
          gh release upload macos-updates dist/macos/appcast.xml --clobber
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/macos-updates/appcast.xml" \
            -o "${RUNNER_TEMP}/published-appcast.xml"
          cmp dist/macos/appcast.xml "${RUNNER_TEMP}/published-appcast.xml"

      - name: Check Homebrew tap token
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Set the HOMEBREW_TAP_TOKEN repository secret with write access to ${HOMEBREW_TAP_REPO}." >&2
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Homebrew Cask
        run: |
          set -euo pipefail
          cask="homebrew-tap/${HOMEBREW_CASK_PATH}"
          VERSION="${{ steps.version.outputs.version }}" \
          SHA256="${{ steps.sha.outputs.sha256 }}" \
          CASK="${cask}" \
          RELEASE_REPOSITORY="${RELEASE_REPOSITORY}" \
          AUTO_UPDATES="true" \
          ruby <<'RUBY'
          path = ENV.fetch("CASK")
          version = ENV.fetch("VERSION")
          sha256 = ENV.fetch("SHA256")
          repository = ENV.fetch("RELEASE_REPOSITORY")
          text = File.read(path)
          installed = text[/version\s+"([^"]+)"/, 1]
          if installed && Gem::Version.new(version) < Gem::Version.new(installed)
            puts "Keeping the newer Homebrew Cask #{installed}."
            exit
          end
          text.sub!(/version\s+"[^"]+"/, %(version "#{version}"))
          text.sub!(/sha256\s+"[^"]+"/, %(sha256 "#{sha256}"))
          text.sub!(%r{url "https://github\.com/[^/]+/[^/]+/releases/download/},
                    %(url "https://github.com/#{repository}/releases/download/))
          text.sub!(/verified:\s+"github\.com\/[^\"]+"/, %(verified: "github.com/#{repository}/"))
          text.sub!(/homepage "https:\/\/github\.com\/[^\"]+"/, %(homepage "https://github.com/#{repository}"))
          if text.match?(/^\s*auto_updates\s+/)
            if ENV.fetch("AUTO_UPDATES") == "true"
              text.sub!(/^\s*auto_updates\s+.*$/, "  auto_updates true")
            else
              text.sub!(/^\s*auto_updates\s+.*\n?/, "")
            end
          elsif ENV.fetch("AUTO_UPDATES") == "true"
            text.sub!(/^(\s*sha256[^\n]*\n)/, "\\1\n  auto_updates true\n")
          end
          File.write(path, text)
          RUBY

      - name: Push Homebrew tap update
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          if git diff --quiet -- "${HOMEBREW_CASK_PATH}"; then
            echo "Homebrew Cask is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${HOMEBREW_CASK_PATH}"
          git commit -m "Update llavon-ime to ${{ steps.version.outputs.version }}"
          git push
