name: Unix CI and preview AUR

on:
  push:
    branches:
      - preview
      - main
  pull_request:
    branches:
      - preview
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUR_PACKAGE_DIR: packaging/aur/llavon-ime-fcitx5-preview-git
  AUR_REPOSITORY: ssh://aur@aur.archlinux.org/llavon-ime-fcitx5-preview-git.git

jobs:
  build-service:
    name: Build and test Unix service
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf autoconf-archive automake libtool \
            cmake \
            curl \
            ninja-build \
            libsqlite3-dev \
            qt6-base-dev qt6-base-dev-tools \
            pkg-config \
            tar \
            unzip \
            zip

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ hashFiles('vcpkg-configuration.json', 'fcitx5/vcpkg.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-core/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Build and test
        run: |
          set -euo pipefail
          cmake -S ime-unix-service -B build/ime-unix-service -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DIME_UNIX_SERVICE_BUILD_TESTS=ON
          cmake --build build/ime-unix-service
          ctest --test-dir build/ime-unix-service --output-on-failure

  build-addon:
    name: Build and test Fcitx5 addon
    runs-on: ubuntu-24.04
    container: archlinux:base-devel

    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm cmake fcitx5 git ninja nlohmann-json pkgconf

      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build and test
        run: |
          set -euo pipefail
          cmake -S fcitx5 -B build/fcitx5 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAVON_IME_BUILD_TESTS=ON
          cmake --build build/fcitx5
          ctest --test-dir build/fcitx5 --output-on-failure

  verify-aur:
    name: Verify preview AUR package
    if: github.ref == 'refs/heads/preview' || github.base_ref == 'preview'
    uses: ./.github/workflows/verify-aur-install.yml
    with:
      package-name: llavon-ime-fcitx5-preview-git

  publish-aur:
    name: Publish preview package to AUR
    needs:
      - build-service
      - build-addon
      - verify-aur
    if: github.event_name == 'push' && github.repository == 'llavon-ime/ime-unix' && github.ref == 'refs/heads/preview'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preview branch head
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/preview | cut -f1)"
          if [[ "${remote_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Preview advanced from ${GITHUB_SHA} to ${remote_sha}; skipping stale publication." >&2
            exit 1
          fi

      - name: Resolve pkgver
        id: pkgver
        run: |
          set -euo pipefail
          describe="$(git describe --long --tags --abbrev=7 2>/dev/null || true)"
          if [[ -n "${describe}" ]]; then
            pkgver="$(printf '%s\n' "${describe}" | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')"
          else
            base_version="$(sed -n 's/^project(llavon-ime VERSION \([^ ]*\).*/\1/p' fcitx5/CMakeLists.txt)"
            base_version="${base_version:-0.1.0}"
            pkgver="${base_version}.r$(git rev-list --count HEAD).g$(git rev-parse --short=7 HEAD)"
          fi
          echo "pkgver=${pkgver}" >> "${GITHUB_OUTPUT}"

      - name: Configure AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "Set the AUR_SSH_PRIVATE_KEY repository secret to an SSH key registered with AUR." >&2
            exit 1
          fi

          ssh_dir="${HOME}/.ssh"
          key_file="${ssh_dir}/aur"
          known_hosts="${ssh_dir}/known_hosts"
          install -d -m 700 "${ssh_dir}"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          ssh-keyscan -T 10 -t ed25519,ecdsa,rsa aur.archlinux.org > "${known_hosts}"
          expected_fingerprints="$(
            printf '%s\n' \
              'SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4' \
              'SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI' \
              'SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8' |
              LC_ALL=C sort
          )"
          actual_fingerprints="$(
            ssh-keygen -lf "${known_hosts}" -E sha256 |
              awk '{print $2}' |
              LC_ALL=C sort -u
          )"
          if [[ "${actual_fingerprints}" != "${expected_fingerprints}" ]]; then
            printf 'AUR SSH host key verification failed.\nExpected:\n%s\nActual:\n%s\n' \
              "${expected_fingerprints}" "${actual_fingerprints}" >&2
            exit 1
          fi
          chmod 600 "${known_hosts}"

          cat > "${ssh_dir}/config" <<EOF
          Host aur.archlinux.org
            HostName aur.archlinux.org
            User aur
            IdentityFile ${key_file}
            BatchMode yes
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ${known_hosts}
          EOF
          chmod 600 "${ssh_dir}/config"

      - name: Clone AUR preview repository
        run: git clone "${AUR_REPOSITORY}" aur-repo

      - name: Update AUR preview package files
        env:
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}
        run: |
          set -euo pipefail
          cp "${AUR_PACKAGE_DIR}/PKGBUILD" aur-repo/PKGBUILD
          cp "${AUR_PACKAGE_DIR}/.SRCINFO" aur-repo/.SRCINFO
          cp "${AUR_PACKAGE_DIR}/README.md" aur-repo/README.md
          ruby <<'RUBY'
          pkgver = ENV.fetch("PKGVER")
          pkgbuild = "aur-repo/PKGBUILD"
          srcinfo = "aur-repo/.SRCINFO"

          text = File.read(pkgbuild)
          text.sub!(/^pkgver=.*/, "pkgver=#{pkgver}")
          File.write(pkgbuild, text)

          text = File.read(srcinfo)
          text.sub!(/^(\s*)pkgver = .*/, "\\1pkgver = #{pkgver}")
          File.write(srcinfo, text)
          RUBY

      - name: Push AUR preview package update
        working-directory: aur-repo
        env:
          PKGVER: ${{ steps.pkgver.outputs.pkgver }}
        run: |
          set -euo pipefail
          git add PKGBUILD .SRCINFO README.md
          if git diff --cached --quiet; then
            echo "AUR preview package repository is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update llavon-ime-fcitx5-preview-git to ${PKGVER}"
          git push origin HEAD:master
