name: Native macOS CI

on:
  push:
    branches:
      - preview
      - main
  pull_request:
    branches:
      - preview
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-native-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-install:
    name: Build and install the native input method
    runs-on: macos-26

    steps:
      - name: Checkout ime-unix
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-native-${{ hashFiles('vcpkg-configuration.json', 'engine/vcpkg.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-core/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-

      - name: Install build prerequisites
        run: brew install autoconf autoconf-archive automake libtool cmake ninja pkg-config qtbase

      - name: Run the engine and raw-key test suites
        run: scripts/verify-engine-tests.sh

      - name: Verify update feed signatures and installation gating
        run: bash macos/scripts/verify-updates.sh

      - name: Fetch vcpkg version history
        run: |
          if [[ "$(git -C vcpkg rev-parse --is-shallow-repository)" == "true" ]]; then
            git -C vcpkg fetch --unshallow
          fi

      - name: Build and test the packaged Metal service
        run: |
          set -euo pipefail
          cmake -S ime-unix-service -B build/ime-unix-service-macos-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_FEATURES=llama-metal \
            -DIME_UNIX_SERVICE_BUILD_TESTS=ON
          cmake --build build/ime-unix-service-macos-ci --parallel 4
          ctest --test-dir build/ime-unix-service-macos-ci --output-on-failure --timeout 60

      - name: Build the app
        run: macos/scripts/build-native-app.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          app="dist/macos/LlavonIME.app"
          plutil -lint "${app}/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "${app}"
          /usr/libexec/PlistBuddy -c "Print :InputMethodConnectionName" "${app}/Contents/Info.plist" \
            | grep -q "_Connection"

      - name: Install into the user input methods
        run: |
          set -euo pipefail
          destination="${HOME}/Library/Input Methods"
          mkdir -p "${destination}"
          rm -rf "${destination}/LlavonIME.app"
          cp -R "dist/macos/LlavonIME.app" "${destination}/"
          test -x "${destination}/LlavonIME.app/Contents/MacOS/LlavonIME"

      - name: Register and verify the input source
        run: |
          set -euo pipefail
          clang -framework Carbon -o "${RUNNER_TEMP}/tis" packaging/macos/tools/tis.c
          "${RUNNER_TEMP}/tis" register "${HOME}/Library/Input Methods/LlavonIME.app"
          "${RUNNER_TEMP}/tis" list com.llavon.inputmethod.LlavonIME
          "${RUNNER_TEMP}/tis" list com.llavon.inputmethod.LlavonIME | grep -q "^com\.llavon\.inputmethod\.LlavonIME"
          "${RUNNER_TEMP}/tis" enable com.llavon.inputmethod.LlavonIME || true

      - name: Launch the input method
        continue-on-error: true
        run: |
          set -euo pipefail
          open "${HOME}/Library/Input Methods/LlavonIME.app"
          sleep 5
          pgrep -x LlavonIME

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: LlavonIME-app
          path: dist/macos/LlavonIME.app
