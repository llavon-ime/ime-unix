name: Verify release input behavior

on:
  workflow_call:
    inputs:
      ref:
        description: Exact release tag to test, not the moving branch head
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact release tag to test, not the moving branch head
        required: true
        type: string

permissions:
  contents: read

jobs:
  engine:
    name: Shared engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
      - name: Cache vcpkg and Sparkle downloads
        uses: ./.github/actions/vcpkg-cache
        with:
          downloads-key: release
      - name: Cache Sparkle release archive
        uses: actions/cache@v4
        with:
          path: build/Sparkle-*.tar.xz
          key: ${{ runner.os }}-sparkle-${{ hashFiles('macos/scripts/sparkle-config.sh') }}
      - name: Install Linux engine dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ nlohmann-json3-dev libatspi2.0-dev libglib2.0-dev
      - name: Install macOS engine dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config
      - name: Run common engine and raw-key suites on release source
        env:
          # Linux already builds the engine with warnings as errors in the Fcitx5 job.
          LLAVON_IME_WARNINGS_AS_ERRORS: ${{ runner.os == 'macOS' && 'ON' || 'OFF' }}
        run: bash scripts/verify-engine-tests.sh
      - name: Verify Swift and C ABI integration
        if: runner.os == 'macOS'
        run: bash macos/scripts/verify-core.sh
