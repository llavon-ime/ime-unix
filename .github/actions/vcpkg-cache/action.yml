name: Cache vcpkg tool and downloads
description: >
  Keep the vcpkg executable and the archives vcpkg downloads next to the binary
  cache, so a GitHub CDN outage does not stop every job that builds with vcpkg.

inputs:
  downloads-key:
    description: >
      Suffix that separates the downloads cache of jobs with different
      manifests, for example ci or release. All jobs on one OS share the prefix.
    required: false
    default: ci

runs:
  using: composite
  steps:
    # Every script skips bootstrap-vcpkg.sh when vcpkg/vcpkg exists. The
    # combined cache action restores it now and stores the tool at the end of
    # the job, when bootstrap or the build has created it.
    - name: Cache the vcpkg executable
      uses: actions/cache@v4
      with:
        path: |
          vcpkg/vcpkg
          vcpkg/vcpkg.disable-metrics
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-tool-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt') }}

    # vcpkg keeps fetched source archives and prebuilt tools in vcpkg/downloads.
    # Restore the newest entry for this platform and let vcpkg fill any gaps.
    - name: Cache vcpkg downloads
      uses: actions/cache@v4
      with:
        path: vcpkg/downloads
        key: ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ inputs.downloads-key }}-${{ hashFiles('vcpkg/scripts/vcpkg-tool-metadata.txt', 'vcpkg-configuration.json', 'engine/vcpkg.json', 'fcitx5/vcpkg.json', 'ime-unix-service/vcpkg.json', 'ime-unix-service/vcpkg-configuration.json', 'ime-unix-service/triplets/**', 'ime-core/vcpkg.json', 'ime-core/vcpkg-configuration.json', 'ime-core/vcpkg-ports/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-${{ inputs.downloads-key }}-
          ${{ runner.os }}-${{ runner.arch }}-vcpkg-downloads-
